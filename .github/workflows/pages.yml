# pianoverse.in: website/site, built from website/index.src.html on every push to main and served by GitHub Pages
# (Settings > Pages > Source: GitHub Actions; custom domain pianoverse.in).
name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 website/build.py page
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site
      - id: deploy
        uses: actions/deploy-pages@v4
